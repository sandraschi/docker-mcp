[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockermcp"
version = "2.13.0"
description = "FastMCP 2.13+ server for Docker operations with Austrian efficiency"
authors = [
    {name = "Sandra Schimanovich", email = "sandra@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=3.1.0,<4",
    "docker>=6.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=0.19.0",
    "anyio>=3.6.0,<5.0.0",
    "structlog>=23.1.0,<25.0.0",
    "loguru>=0.7.0",
    "python-json-logger>=2.0.0,<3.0.0",
    "cryptography>=41.0.0,<43.0.0",
    "typing-extensions>=4.4.0; python_version<\"3.10\"",
    "aiodocker>=0.24.0,<1.0.0",
    "fastapi>=0.68.0,<1.0.0",
    "uvicorn>=0.15.0,<1.0.0",
    "python-multipart>=0.0.5,<1.0.0",
    "httpx>=0.23.0,<1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "black>=23.7.0,<25.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.5.0,<2.0.0",
    "ruff>=0.0.282,<1.0.0"
]

[project.urls]
Homepage = "https://github.com/sandraschi/dockermcp"
Documentation = "https://github.com/sandraschi/dockermcp#readme"
Repository = "https://github.com/sandraschi/dockermcp"

[tool.setuptools]
packages = ["dockermcp"]
package-dir = { "" = "src" }

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
