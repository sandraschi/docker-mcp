version: '3.8'

services:
  # Loki - Log aggregation system
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - monitoring

  # Promtail - Log collector
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
      - ./logs:/var/log/dockermcp
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana.ini:/etc/grafana/grafana.ini
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-$(openssl rand -hex 16)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.office365.com
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-alerts@yourdomain.com}
      - GF_SMTP_FROM_NAME="Docker MCP Alerts"
      - GF_SMTP_STARTTLS_POLICY=OpportunisticStartTLS
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_FEATURE_TOGGLES_ENABLE=tempoSearch
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring

  # Prometheus - Metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - monitoring

  # Backup service with cron
  backup:
    image: alpine:3.16
    volumes:
      - backup_data:/backups
      - ./monitoring/backup.sh:/backup.sh
      - ./monitoring/setup-backup-cron.sh:/setup-backup-cron.sh
      - grafana_data:/var/lib/grafana:ro
      - prometheus_data:/prometheus:ro
      - loki_data:/loki:ro
    entrypoint: /bin/sh -c "chmod +x /backup.sh /setup-backup-cron.sh && /setup-backup-cron.sh"
    restart: unless-stopped
    networks:
      - monitoring
    # The backup will run daily at 2 AM via cron
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  monitoring:
    driver: bridge

  # Add backup volume
  backup_data:

volumes:
  loki_data:
  grafana_data:
  prometheus_data:
  backup_data:
