[smtp]
enabled = true
host = smtp.office365.com:587
user = alerts@yourdomain.com
# Password will be set via environment variable
password = ${SMTP_PASSWORD}
from_address = alerts@yourdomain.com
from_name = Docker MCP Alerts
skip_verify = false

[alerting]
enabled = true
execute_alerts = true

[unified_alerting]
enabled = true
evaluate = true
execution_timeout = 30s
max_attempts = 3
min_interval = 1m

[security]
admin_user = admin
# Admin password will be set via environment variable
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
secret_key = ${GF_SECURITY_SECRET_KEY}

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true
