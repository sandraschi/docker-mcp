apiVersion: 1

policies:
  - receiver: default-email-receiver
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    
    # Route critical alerts immediately
    routes:
      - receiver: email-notifier
        matchers:
          - severity=~critical
        continue: true
        group_by: ['alertname', 'severity', 'instance']
        
      # Route warnings with longer intervals
      - receiver: default-email-receiver
        matchers:
          - severity=~warning
        group_wait: 1m
        group_interval: 15m
        repeat_interval: 8h
        continue: true
        
    # Default notification settings
    receiver: default-email-receiver
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    
    # Inhibit rules to prevent duplicate alerts
    inhibit_rules:
      - source_match:
          alertname: 'NodeDown'
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'instance']
